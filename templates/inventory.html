<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6 bg-gray-100">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold mb-4">Inventory Management</h1>

      <div class="mb-4">
        <button id="showAdd" class="px-4 py-2 bg-blue-600 text-white rounded">Add Item</button>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <table class="w-full">
          <thead>
            <tr class="text-left text-sm text-gray-600">
              <th class="px-4 py-2">Product</th>
              <th class="px-4 py-2">Stock</th>
              <th class="px-4 py-2">Reorder Level</th>
              <th class="px-4 py-2">Price</th>
              <th class="px-4 py-2">Status</th>
              <th class="px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="adminInventoryTable" class="divide-y"></tbody>
        </table>
      </div>

      <!-- Add / Edit Form Modal -->
      <div id="modal" class="fixed inset-0 bg-black bg-opacity-30 hidden items-center justify-center">
        <div class="bg-white p-6 rounded w-full max-w-md">
          <h2 id="modalTitle" class="text-lg font-bold mb-2">Add Item</h2>
          <div class="space-y-2">
            <input id="prodName" class="w-full border px-3 py-2" placeholder="Product name" />
            <input id="prodStock" type="number" class="w-full border px-3 py-2" placeholder="Initial stock" />
            <input id="prodReorder" type="number" class="w-full border px-3 py-2" placeholder="Reorder level" />
            <input id="prodPrice" type="number" step="0.01" class="w-full border px-3 py-2" placeholder="Price (optional)" />
          </div>

          <div class="mt-4 flex justify-end gap-2">
            <button id="cancelBtn" class="px-4 py-2">Cancel</button>
            <button id="saveBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
          </div>
        </div>
      </div>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
