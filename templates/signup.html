<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Parallel Fulfillment System</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#334155",
                        background: "#f8fafc",
                        surface: "#ffffff",
                        outline: "#e2e8f0",
                        text: "#0f172a",
                        muted: "#64748b",
                        success: "#16a34a",
                        warning: "#f59e0b",
                        danger: "#dc2626"
                    },
                    spacing: {
                        gutter: "24px",
                        card: "20px"
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }
    </style>
</head>

<body class="bg-background text-text min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-surface border border-outline rounded-xl shadow-sm p-8">

            <!-- Logo and Branding -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-12 h-12 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-lg mb-4">
                    PF
                </div>
                <h1 class="text-2xl font-bold text-center">Create Account</h1>
                <p class="text-sm text-muted text-center mt-2">Join Parallel Fulfillment System</p>
            </div>

            <!-- Form -->
            <form method="POST" action="/signup" class="space-y-4">

                <!-- Full Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-text mb-2">
                        Full Name
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="John Doe"
                        class="w-full px-4 py-2 border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition">
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-text mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="your@email.com"
                        class="w-full px-4 py-2 border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition">
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-text mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition">
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-text mb-2">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-2 border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition">
                </div>

                <!-- Sign Up Button -->
                <button
                    type="submit"
                    class="w-full py-2 mt-6 rounded-lg bg-[#0f172a] hover:bg-[#1e293b] text-white font-medium transition">
                    Create Account
                </button>

            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-outline"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-surface text-muted">Already have an account?</span>
                </div>
            </div>

            <!-- Sign In Link -->
            <a href="/login" class="block w-full py-2 text-center rounded-lg border border-outline text-primary font-medium hover:bg-slate-50 transition">
                Sign In
            </a>

        </div>

        <!-- Footer Text -->
        <p class="text-center text-xs text-muted mt-6">
            © 2024 Parallel Fulfillment System. All rights reserved.
        </p>

    </div>

</body>

</html>
